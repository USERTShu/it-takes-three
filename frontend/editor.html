<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑器 · 远程 VP 协作编辑器</title>
  <link rel="stylesheet" href="/vendor/monaco-editor-0.52.2/min/vs/editor/editor.main.css">
  <link rel="stylesheet" href="/css/app.css?v=13">
  <link rel="stylesheet" href="/css/cursors.css?v=13">
  <link rel="stylesheet" href="/css/run-panel.css?v=13">
  <script type="importmap">
  {
    "imports": {
      "yjs": "/vendor/yjs-13.6.33/dist/yjs.mjs",
      "y-websocket": "/vendor/y-websocket-2.0.4/src/y-websocket.js",
      "y-monaco": "/vendor/y-monaco-0.1.6/src/y-monaco.js",
      "y-protocols/awareness": "/vendor/y-protocols-1.0.6/awareness.js",
      "y-protocols/sync": "/vendor/y-protocols-1.0.6/sync.js",
      "y-protocols/auth": "/vendor/y-protocols-1.0.6/auth.js",
      "lib0/observable": "/vendor/lib0-0.2.118/observable.js",
      "lib0/array": "/vendor/lib0-0.2.118/array.js",
      "lib0/math": "/vendor/lib0-0.2.118/math.js",
      "lib0/map": "/vendor/lib0-0.2.118/map.js",
      "lib0/encoding": "/vendor/lib0-0.2.118/encoding.js",
      "lib0/decoding": "/vendor/lib0-0.2.118/decoding.js",
      "lib0/random": "/vendor/lib0-0.2.118/random.js",
      "lib0/promise": "/vendor/lib0-0.2.118/promise.js",
      "lib0/buffer": "/vendor/lib0-0.2.118/buffer.js",
      "lib0/error": "/vendor/lib0-0.2.118/error.js",
      "lib0/binary": "/vendor/lib0-0.2.118/binary.js",
      "lib0/function": "/vendor/lib0-0.2.118/function.js",
      "lib0/set": "/vendor/lib0-0.2.118/set.js",
      "lib0/logging": "/vendor/lib0-0.2.118/logging.js",
      "lib0/time": "/vendor/lib0-0.2.118/time.js",
      "lib0/string": "/vendor/lib0-0.2.118/string.js",
      "lib0/iterator": "/vendor/lib0-0.2.118/iterator.js",
      "lib0/object": "/vendor/lib0-0.2.118/object.js",
      "lib0/environment": "/vendor/lib0-0.2.118/environment.js",
      "lib0/broadcastchannel": "/vendor/lib0-0.2.118/broadcastchannel.js",
      "lib0/url": "/vendor/lib0-0.2.118/url.js",
      "lib0/mutex": "/vendor/lib0-0.2.118/mutex.js",
      "lib0/webcrypto": "/vendor/lib0-0.2.118/webcrypto.js"
    }
  }
  </script>
</head>
<body class="editor-page">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/lobby.html" class="back-link">← 大厅</a>
      <strong id="contest-name">比赛</strong>
      <span id="timer" class="timer">--:--:--</span>
      <span id="conn-badge" class="conn-badge connecting">连接中…</span>
      <span id="user-info"></span>
      <label class="toggle-names" title="显示/隐藏远端用户名标签">
        <input type="checkbox" id="toggle-names" checked> 名称
      </label>
      <span id="save-hint" class="save-hint hidden"></span>
      <button id="btn-settings" class="icon-btn" title="设置（字号/行高/主题/制表符）">⚙</button>
      <span class="run-bar">
        <button id="btn-run" class="run-btn" title="运行（编译并执行当前文件，Ctrl+F5）">▶ 运行</button>
        <button id="btn-debug" class="run-btn" title="调试（断点/单步/变量，F5）">● 调试</button>
        <button id="btn-stop" class="run-btn danger hidden" title="停止">■ 停止</button>
      </span>
    </div>
  </header>

  <div class="editor-layout">
    <aside id="sidebar" class="sidebar">
      <div id="members-panel">
        <div class="panel-title">成员</div>
        <div id="member-list"></div>
      </div>
      <div id="files-panel">
        <div class="panel-title">文件</div>
        <div id="file-list" class="file-list"></div>
        <div class="file-actions">
          <input id="new-file-name" type="text" placeholder="main.cpp" spellcheck="false">
          <button id="btn-add-file" class="btn small">新建</button>
        </div>
      </div>
    </aside>
    <div class="editor-main">
    <main id="editor-container" class="editor-container">
      <span id="debug-toolbar" class="debug-toolbar hidden" title="调试工具栏">
        <button data-dbg="continue" title="继续 (F5)">▶</button>
        <button data-dbg="next" title="单步跳过 (F10)">⏷</button>
        <button data-dbg="step" title="单步进入 (F11)">⏷</button>
        <button data-dbg="finish" title="单步跳出 (Shift+F11)">⏸</button>
        <button data-dbg="restart" title="重启">⟳</button>
        <button data-dbg="stop" title="停止">■</button>
      </span>
    </main>
    <section id="run-panel" class="run-panel hidden">
      <div class="run-panel-header">
        <div class="run-tabs" role="tablist">
          <button data-tab="terminal" class="run-tab active">终端</button>
          <button data-tab="console" class="run-tab">调试控制台</button>
          <button data-tab="vars" class="run-tab">变量</button>
          <button data-tab="stack" class="run-tab">调用堆栈</button>
          <button data-tab="watch" class="run-tab">监视</button>
        </div>
        <div class="run-panel-actions">
          <button id="btn-panel-close" class="panel-close" title="关闭面板">✕</button>
        </div>
      </div>
      <div class="run-panel-body">
        <div id="tab-terminal" class="run-tabpane active">
          <div id="term-output" class="term-output"></div>
          <div class="term-input-row">
            <span class="term-prompt">&gt;</span>
            <input id="term-input" type="text" spellcheck="false" placeholder="标准输入 (stdin)，回车发送" disabled>
          </div>
        </div>
        <div id="tab-console" class="run-tabpane">
          <div id="console-output" class="term-output"></div>
          <div class="term-input-row">
            <span class="term-prompt">&gt;</span>
            <input id="console-input" type="text" spellcheck="false" placeholder="调试时程序的标准输入，回车发送" disabled>
          </div>
        </div>
        <div id="tab-vars" class="run-tabpane">
          <table class="kv-table">
            <thead><tr><th>名称</th><th>值</th><th>类型</th></tr></thead>
            <tbody id="vars-body"></tbody>
          </table>
          <div id="vars-empty" class="tab-empty">（尚未运行到断点）</div>
        </div>
        <div id="tab-stack" class="run-tabpane">
          <div id="stack-list" class="stack-list"></div>
        </div>
        <div id="tab-watch" class="run-tabpane">
          <div class="watch-add-row">
            <input id="watch-input" type="text" spellcheck="false" placeholder="输入监控表达式，回车添加（如 a[0] / node.val / a + 10）">
            <button id="watch-add" class="btn small">添加</button>
          </div>
          <table class="kv-table">
            <thead><tr><th>表达式</th><th>值</th></tr></thead>
            <tbody id="watch-body"></tbody>
          </table>
          <div id="watch-empty" class="tab-empty">（未添加监控表达式）</div>
        </div>
      </div>
    </section>
    </div>
  </div>

  <div id="settings-pop" class="settings-pop hidden">
    <div class="settings-title">编辑器设置</div>
    <div class="settings-row">
      <label for="set-font-size">字号</label>
      <select id="set-font-size">
        <option value="12">12</option><option value="13">13</option><option value="14">14</option>
        <option value="15">15</option><option value="16">16</option><option value="18">18</option>
        <option value="20">20</option><option value="24">24</option><option value="28">28</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="set-line-height">行高</label>
      <select id="set-line-height">
        <option value="16">16</option><option value="18">18</option><option value="20">20</option>
        <option value="22">22</option><option value="24">24</option><option value="28">28</option>
        <option value="32">32</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="set-theme">主题</label>
      <select id="set-theme">
        <option value="dark">深色</option><option value="light">浅色</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="set-tab-size">制表符</label>
      <select id="set-tab-size">
        <option value="2">2</option><option value="4">4</option><option value="8">8</option>
      </select>
    </div>
  </div>

  <div id="waiting-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2>比赛尚未开始</h2>
      <p>等待创建者在大厅点击「开始比赛」…</p>
      <button id="btn-start-here" class="btn primary hidden">我是创建者，开始比赛</button>
      <p id="waiting-error" class="error hidden"></p>
    </div>
  </div>

  <script src="/js/auth.js?v=13"></script>
  <script src="/js/api.js?v=13"></script>
  <script type="module" src="/js/app-editor.js?v=13"></script>
</body>
</html>
